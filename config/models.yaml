models:
  random_seed: 42

  random_forest:
    enabled: true
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    n_jobs: -1

  autoencoder:
    enabled: true
    encoder_layers: [32, 16, 8]
    decoder_layers: [16, 32]
    activation: "relu"
    optimizer: "adam"
    loss: "mse"
    epochs: 50
    batch_size: 32
    validation_split: 0.1

  hybrid_scorer:
    voting_strategy: "weighted"
    weights:
      random_forest: 0.7
      autoencoder: 0.3
